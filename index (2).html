<style>
  :root{
    --bg:#111215;
    --surface:#1a1c20;
    --surface-2:#232529;
    --chrome:#cdd1d7;
    --chrome-dim:#7d8288;
    --accent:#e2091c;
    --accent-dim:#5c1015;
    --text:#f4f3ef;
    --text-dim:#9aa0a6;
    --line: rgba(205,209,215,0.14);
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  #app{max-width:880px;margin:0 auto;padding:0 20px 80px;position:relative;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 0;background:linear-gradient(var(--bg) 82%, transparent);}
  .brandmark{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0.16em;color:var(--chrome-dim);text-transform:uppercase;}
  /* ---------- hero ---------- */
  .hero{padding:28px 0 36px;border-bottom:1px solid var(--line);}
  .hero-title{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,7vw,58px);letter-spacing:0.01em;line-height:0.98;margin:0 0 6px;
    background:linear-gradient(135deg,#fff 0%, var(--chrome) 35%, #6a6e74 55%, var(--chrome) 75%, #fff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;}
  .hero-sub{font-family:var(--font-mono);font-size:12px;letter-spacing:0.15em;color:var(--text-dim);text-transform:uppercase;margin-bottom:22px;}
  .save-warn-banner{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#3a0505;color:#ffb4b4;border-top:1px solid var(--accent-dim);padding:12px 16px;font-family:var(--font-mono);font-size:12px;text-align:center;}

  .quick-nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px;}
  .quick-nav-item{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:2px;}
  .quick-nav-item:hover{color:var(--text);border-color:var(--chrome-dim);}

  /* ---------- section label ---------- */
  .section-label{display:flex;align-items:center;gap:10px;margin:36px 0 16px;}
  .section-label span{font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;color:var(--chrome-dim);text-transform:uppercase;white-space:nowrap;}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}

  /* ---------- schedule cards ---------- */
  .card-list{display:flex;flex-direction:column;gap:10px;}
  .card{position:relative;display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px 16px;cursor:pointer;transition:border-color .15s, background .15s;overflow:hidden;}
  .card:hover{border-color:var(--chrome-dim);background:var(--surface-2);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent-bar,var(--chrome-dim));}
  .card.upcoming::before{background:var(--accent);}
  .dateblock{font-family:var(--font-mono);min-width:74px;text-align:center;padding-right:14px;border-right:1px solid var(--line);}
  .dateblock .day{font-size:24px;font-weight:700;color:var(--text);line-height:1;}
  .dateblock .ym{font-size:10px;color:var(--text-dim);letter-spacing:0.08em;margin-top:4px;}
  .cardbody{flex:1;min-width:0;}
  .card-title{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0.01em;color:var(--text);text-transform:uppercase;margin-bottom:3px;}
  .card-venue{font-size:12.5px;color:var(--text-dim);}
  .card-del{position:absolute;right:12px;bottom:10px;background:none;border:none;color:var(--text-dim);font-size:16px;padding:2px 6px;}
  .card-del:hover{color:var(--accent);}
  .empty-state{padding:30px 4px;color:var(--text-dim);font-size:13px;border:1px dashed var(--line);border-radius:2px;text-align:center;}

  .year-group{margin-bottom:10px;}
  .year-header{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 16px;font-family:var(--font-display);font-size:16px;letter-spacing:0.02em;color:var(--text);text-align:left;}
  .year-header:hover{border-color:var(--chrome-dim);background:var(--surface-2);}
  .year-header-static{cursor:default;}
  .year-header-static:hover{border-color:var(--line);background:var(--surface);}
  .year-chevron{color:var(--accent);font-size:12px;width:12px;}
  .year-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:0.05em;}
  .year-group .card-list{margin-top:8px;}

  /* ---------- add-live form ---------- */
  .inline-form{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;}
  .form-row{display:flex;gap:10px;flex-wrap:wrap;}
  .form-row label{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;color:var(--chrome-dim);text-transform:uppercase;}
  .form-row input, .form-row textarea{background:#0c0d0f;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:2px;font-size:13px;}
  .form-row input:focus, .form-row textarea:focus{outline:none;border-color:var(--accent-dim);}
  .btn{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:9px 16px;border-radius:2px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);align-self:flex-start;}
  .btn:hover{border-color:var(--chrome-dim);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn-accent:hover{background:#c50818;}
  .add-btn{width:100%;text-align:center;padding:12px;border:1px dashed var(--line);border-radius:2px;background:none;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px;}
  .add-btn:hover{border-color:var(--chrome-dim);color:var(--text);}

  /* ---------- detail view ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;margin:22px 0 18px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--text);}
  .detail-header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:6px;}
  .detail-date{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:0.1em;margin-bottom:8px;}
  .detail-title{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,38px);text-transform:uppercase;line-height:1.05;margin:0 0 8px;}
  .detail-venue{font-size:13.5px;color:var(--text-dim);}
  .detail-ticket-btn{display:inline-block;margin-top:14px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;color:#fff;background:var(--accent);padding:11px 20px;border-radius:2px;text-decoration:none;}
  .detail-ticket-btn:hover{background:var(--accent-dim);}

  .stats-list{display:flex;flex-direction:column;}
  .stats-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  .stats-row:last-child{border-bottom:none;}
  .stats-rank{font-family:var(--font-mono);font-size:12px;color:var(--chrome-dim);min-width:22px;}
  .stats-name{font-family:var(--font-display);font-size:14px;letter-spacing:0.01em;flex:1;}
  .stats-count{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);min-width:38px;text-align:right;}

  .song-picker{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:2px;background:#0c0d0f;margin-top:8px;}
  .song-picker-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;}
  .song-picker-row:last-child{border-bottom:none;}
  .song-picker-row:hover{background:var(--surface-2);}
  .song-picker-row input[type="radio"]{accent-color:var(--accent);}
  .song-picker-row.special span{color:var(--chrome-dim);font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.04em;}

  .setlist{list-style:none;margin:0;padding:0;counter-reset:track;}
  .setlist li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);}
  .setlist li:last-child{border-bottom:none;}
  .mc-row .track-title{color:var(--text-dim);font-style:italic;letter-spacing:0.05em;}
  .track-no{font-family:var(--font-mono);font-size:12px;color:var(--chrome-dim);min-width:26px;background:#0c0d0f;border:1px solid var(--line);border-radius:2px;text-align:center;padding:3px 0;}
  .track-title{font-family:var(--font-display);font-size:15.5px;letter-spacing:0.01em;flex:1;}
  .track-del{background:none;border:none;color:var(--text-dim);font-size:14px;}
  .track-del:hover{color:var(--accent);}

  .photo-embed-list{display:flex;flex-direction:column;gap:14px;}
  .photo-embed-item{position:relative;}
  .photo-del{display:block;margin-top:6px;background:none;border:1px solid var(--line);color:var(--text-dim);font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:6px 12px;border-radius:2px;}
  .photo-del:hover{color:var(--accent);border-color:var(--accent-dim);}

  .video-embed{border:1px solid var(--line);border-radius:2px;padding:14px;background:var(--surface);}
  .video-fallback{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:2px;background:var(--surface-2);margin-top:10px;}
  .video-fallback:hover{border-color:var(--chrome-dim);}
  .no-video{color:var(--text-dim);font-size:13px;padding:6px 0;}

  .hint{font-size:11px;color:var(--chrome-dim);font-family:var(--font-mono);margin-top:6px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  ::selection{background:var(--accent-dim);color:#fff;}
</style>

  function getBakedData(){
    var el = document.getElementById('baked-data');
    if (!el) return null;
    try{
      var parsed = JSON.parse(el.textContent || '{}');
      if (parsed && Array.isArray(parsed.lives) && parsed.lives.length){
        return parsed;
      }
    } catch(e){}
    return null;
  }

  function loadData(cb){
    var baked = getBakedData();
    var done = false;
    var safetyTimer = setTimeout(function(){
      if (done) return;
      done = true;
      console.error('loadData timed out; falling back to seed/baked data');
      state.lives = baked ? baked.lives : seedData();
      state.songs = (baked && baked.songs && baked.songs.length) ? baked.songs : seedSongsFromLives();
      cb();
    }, 6000);
    function finish(){
      if (done) return;
      done = true;
      clearTimeout(safetyTimer);
      var fixed = dedupeLiveIds();
      if (fixed) saveData();
      cb();
    }
    function useFallback(){
      state.lives = baked ? baked.lives : seedData();
      state.songs = (baked && baked.songs && baked.songs.length) ? baked.songs : seedSongsFromLives();
    }
    if (!window.storage){
      useFallback();
      finish();
      return;
    }
    try{
      window.storage.get('lives', false).then(function(res){
        try{
          if (res && res.value){
            try{ state.lives = JSON.parse(res.value); } catch(e){ state.lives = baked ? baked.lives : seedData(); }
          } else {
            state.lives = baked ? baked.lives : seedData();
            saveData();
          }
        } catch(e){ state.lives = baked ? baked.lives : seedData(); }
        return window.storage.get('songs', false).then(function(sres){
          try{
            if (sres && sres.value){
              try{ state.songs = JSON.parse(sres.value); } catch(e){ state.songs = (baked && baked.songs && baked.songs.length) ? baked.songs : seedSongsFromLives(); saveSongs(); }
            } else {
              state.songs = (baked && baked.songs && baked.songs.length) ? baked.songs : seedSongsFromLives();
              saveSongs();
            }
          } catch(e){ state.songs = seedSongsFromLives(); }
        }).catch(function(){
          state.songs = seedSongsFromLives();
        });
      }).catch(function(){
        useFallback();
      }).then(finish, finish);
    } catch(syncErr){
      console.error('loadData sync error; falling back', syncErr);
      useFallback();
      finish();
    }
  }

  function showSaveWarning(){
    if (document.getElementById('save-warn-banner')) return;
    var bar = document.createElement('div');
    bar.id = 'save-warn-banner';
    bar.className = 'save-warn-banner';
    bar.textContent = '⚠ 保存に失敗しました。編集内容が消える前に「更新済みHTMLをダウンロード」で保存してください。';
    document.body.appendChild(bar);
  }

  function saveData(retry){
    if (!window.storage) return;
    window.storage.set('lives', JSON.stringify(state.lives), false).then(function(res){
      if (!res && !retry){ saveData(true); return; }
      if (!res && retry){ showSaveWarning(); }
    }).catch(function(err){
      console.error('storage save failed', err);
      if (!retry){ setTimeout(function(){ saveData(true); }, 800); }
      else { showSaveWarning(); }
    });
  }

  function saveSongs(retry){
    if (!window.storage) return;
    window.storage.set('songs', JSON.stringify(state.songs), false).then(function(res){
      if (!res && !retry){ saveSongs(true); return; }
      if (!res && retry){ showSaveWarning(); }
    }).catch(function(err){
      console.error('songs storage save failed', err);
      if (!retry){ setTimeout(function(){ saveSongs(true); }, 800); }
      else { showSaveWarning(); }
    });
  }

  function seedSongsFromLives(){
    // build an initial song master from whatever is currently in the setlists,
    // using the legacy paren-stripping normalization as the starting canonical title
    var seen = {};
    var out = [];
    state.lives.forEach(function(live){
      if (!live.setlist) return;
      live.setlist.forEach(function(raw){
        if (!isCountableSong(raw)) return;
        var cleaned = stripEncoreMarker(raw);
        var canonical = legacyNormalize(cleaned);
        if (!canonical || seen[canonical]) return;
        seen[canonical] = true;
        out.push({ id: uid(), title: canonical, aliases: [canonical] });
      });
    });
    return out;
  }

  function esc(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function isSafeUrl(u){
    return /^https?:\/\//i.test(u || '');
  }

  function fmtDateParts(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return {day:'--', ym:'----'};
    var day = String(d.getDate()).padStart(2,'0');
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    return {day: day, ym: y + '.' + m};
  }

  function sortedLives(){
    return state.lives.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  }

  // ---------------- render root ----------------
  function render(){
    var app = document.getElementById('app');
    try{
      app.innerHTML = '';
      app.appendChild(renderTopbar());
      if (state.view.type === 'top'){
        app.appendChild(renderTopView());
      } else if (state.view.type === 'song'){
        app.appendChild(renderSongDetailView(state.view.name));
      } else {
        app.appendChild(renderDetailView(state.view.id));
      }
    } catch(e){
      console.error('render failed', e);
      app.innerHTML = '<div style="padding:60px 20px;color:#f4f3ef;font-family:monospace;font-size:13px;line-height:1.7;max-width:600px;margin:0 auto;">'
        + '⚠ 表示中にエラーが発生しました。<br><br>'
        + '一度ページを再読み込みしてください。直らない場合は、この画面のスクリーンショットを添えてClaudeに伝えてください。<br><br>'
        + '<span style="color:#9aa0a6;">' + (e && e.message ? e.message.replace(/</g,"&lt;") : '') + '</span>'
        + '</div>';
    }
  }

  // ---------------- top view ----------------
  function renderTopView(){
    var wrap = document.createElement('div');

    var hero = document.createElement('div');
    hero.className = 'hero';
    var h1 = document.createElement('h1');
    h1.className = 'hero-title';
    h1.textContent = 'ベルホーム';
    var sub = document.createElement('div');
    sub.className = 'hero-sub';
    sub.textContent = 'UNOFFICIAL LIVE LOG — SCHEDULE / SETLIST / ARCHIVE';
    hero.appendChild(h1);
    hero.appendChild(sub);

    wrap.appendChild(hero);
    wrap.appendChild(renderQuickNav());

    var lives = sortedLives();
    var upcoming = lives.filter(function(l){ return l.date >= todayStr; });
    var past = lives.filter(function(l){ return l.date < todayStr; }).reverse();

    wrap.appendChild(sectionLabel('SCHEDULE / 今後のライブ', 'sec-schedule'));
    if (state.editMode){
      wrap.appendChild(renderAddLiveButton());
      wrap.appendChild(renderImportExportPanel());
      wrap.appendChild(renderSongMasterPanel());
    }
    wrap.appendChild(renderCardList(upcoming, true));

    wrap.appendChild(sectionLabel('ARCHIVE / 過去のライブ', 'sec-archive'));
    wrap.appendChild(renderArchiveByYear(past));

    wrap.appendChild(sectionLabel('SONG DATA / 演奏回数ランキング', 'sec-songdata'));
    wrap.appendChild(renderSongStats());

    return wrap;
  }

  function renderQuickNav(){
    var nav = document.createElement('div');
    nav.className = 'quick-nav';
    var items = [
      {label:'SCHEDULE', id:'sec-schedule'},
      {label:'ARCHIVE', id:'sec-archive'},
      {label:'SONG DATA', id:'sec-songdata'}
    ];
    items.forEach(function(it){
      var a = document.createElement('button');
      a.className = 'quick-nav-item';
      a.textContent = it.label;
      a.onclick = function(){
        var target = document.getElementById(it.id);
        if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
      };
      nav.appendChild(a);
    });
    return nav;
  }

  var NON_SONG_LABELS = ['mc','MC'];

  function legacyNormalize(title){
    if (!title) return '';
    var t = String(title).trim();
    // strip trailing parenthetical variant tags, e.g. "バラッド (mutist beach mix)" -> "バラッド"
    t = t.replace(/[\s]*[\(（][^\)）]*[\)）]\s*$/, '');
    t = t.trim();
    return t;
  }

  // Resolve a raw setlist string to its canonical song-master title.
  // Looks up state.songs (title or alias, exact match) first; falls back to
  // the legacy paren-stripping heuristic for anything not yet registered.
  function resolveSongTitle(rawCleaned){
    var t = String(rawCleaned || '').trim();
    if (!t) return '';
    for (var i=0; i<state.songs.length; i++){
      var song = state.songs[i];
      if (song.title === t) return song.title;
      if (song.aliases && song.aliases.indexOf(t) !== -1) return song.title;
    }
    return legacyNormalize(t);
  }

  function findSongByTitle(title){
    return state.songs.find(function(s){ return s.title === title; });
  }

  function ensureSongRegistered(rawTitle){
    var t = String(rawTitle || '').trim();
    if (!t) return;
    var resolved = resolveSongTitle(t);
    var existing = findSongByTitle(resolved);
    if (existing){
      if (existing.aliases.indexOf(t) === -1){
        existing.aliases.push(t);
        saveSongs();
      }
      return existing;
    }
    var song = { id: uid(), title: resolved, aliases: [t] };
    state.songs.push(song);
    saveSongs();
    return song;
  }

  function isCountableSong(title){
    if (!title) return false;
    var t = String(title).trim();
    if (t === '') return false;
    if (NON_SONG_LABELS.indexOf(t) !== -1) return false;
    return true;
  }

  function stripEncoreMarker(title){
    return String(title).replace(/^(en\.|アンコール[:：]?|encore[:：]?)\s*/i, '');
  }

  function computeSongStats(){
    var counts = {}; // canonical title -> count
    state.lives.forEach(function(live){
      if (!live.setlist) return;
      live.setlist.forEach(function(raw){
        if (!isCountableSong(raw)) return;
        var cleaned = stripEncoreMarker(raw);
        var canonical = resolveSongTitle(cleaned);
        if (!canonical) return;
        counts[canonical] = (counts[canonical] || 0) + 1;
      });
    });
    var arr = Object.keys(counts).map(function(name){ return {name: name, count: counts[name]}; });
    arr.sort(function(a,b){
      if (b.count !== a.count) return b.count - a.count;
      return a.name < b.name ? -1 : 1;
    });
    return arr;
  }

  function downloadBakedHtml(){
    var payload = JSON.stringify({lives: state.lives, songs: state.songs});
    var html = PRISTINE_HTML.replace(
      /(<script type="application\/json" id="baked-data">)([\s\S]*?)(<\/script>)/,
      function(m, p1, p2, p3){ return p1 + payload.replace(/</g,'\\u003c') + p3; }
    );
    html = '<!DOCTYPE html>\n' + html;
    var blob = new Blob([html], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bercedes-menz-fansite.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function mergeImportedLives(items){
    var added = 0, updated = 0;
    items.forEach(function(item){
      if (!item || !item.date) return;
      var key = (item.date || '') + '|' + (item.title || '');
      var existing = state.lives.find(function(l){
        return ((l.date || '') + '|' + (l.title || '')) === key;
      });
      if (existing){
        if (!existing.venue && item.venue) existing.venue = item.venue;
        if (!existing.city && item.city) existing.city = item.city;
        if ((!existing.setlist || existing.setlist.length === 0) && item.setlist && item.setlist.length) existing.setlist = item.setlist;
        if ((!existing.photos || existing.photos.length === 0) && item.photos && item.photos.length) existing.photos = item.photos;
        if (!existing.videoUrl && item.videoUrl) existing.videoUrl = item.videoUrl;
        if ((!existing.videos || existing.videos.length === 0) && item.videos && item.videos.length) existing.videos = item.videos;
        if (!existing.setlistTweetUrl && item.setlistTweetUrl) existing.setlistTweetUrl = item.setlistTweetUrl;
        if (!existing.flyerUrl && item.flyerUrl) existing.flyerUrl = item.flyerUrl;
        if (!existing.ticketUrl && item.ticketUrl) existing.ticketUrl = item.ticketUrl;
        updated++;
      } else {
        state.lives.push({
          id: uid(),
          date: item.date,
          venue: item.venue || '',
          city: item.city || '',
          title: item.title || '',
          setlist: item.setlist || [],
          photos: item.photos || [],
          videoUrl: item.videoUrl || '',
          videos: item.videos || [],
          setlistTweetUrl: item.setlistTweetUrl || '',
          flyerUrl: item.flyerUrl || '',
          ticketUrl: item.ticketUrl || ''
        });
        added++;
      }
    });
    saveData();
    render();
    return {added: added, updated: updated};
  }

  function getKnownSongNames(){
    var counts = {};
    computeSongStats().forEach(function(s){ counts[s.name] = s.count; });
    var names = state.songs.map(function(s){ return s.title; });
    names.sort(function(a,b){
      var ca = counts[a] || 0, cb = counts[b] || 0;
      if (cb !== ca) return cb - ca;
      return a < b ? -1 : 1;
    });
    return names;
  }

      saveData(); render();
    }
    btn.onclick = addIt;
    f.input.addEventListener('keydown', function(e){ if (e.key==='Enter') addIt(); });
    form.appendChild(row);
    form.appendChild(btn);
    var hint = document.createElement('div');
    hint.className='hint';
    hint.textContent = '※ その日のライブ映像ポストのURLを貼り付けてください（複数追加できます）';
    form.appendChild(hint);
    return form;
  }

  try{
    var params = new URLSearchParams(window.location.search);
    if (params.get('admin') === '1'){ state.editMode = true; }
  } catch(e){}

  loadData(function(){
    render();
    // read-only view has no further re-renders to retry a late-loading
    // widgets.js, so explicitly retry a few times after the initial paint
    setTimeout(loadTwitterWidgets, 800);
    setTimeout(loadTwitterWidgets, 2000);
    setTimeout(loadTwitterWidgets, 4000);
  });
})();
</script>
</body>
</html>
